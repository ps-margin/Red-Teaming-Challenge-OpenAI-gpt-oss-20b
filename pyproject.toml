[project]
name = "artemis-redteam"
version = "1.0.0"
description = "ARTEMIS: Advanced Reasoning Threat Evaluation and Manipulation Intelligence System for AI Red-Teaming"
readme = "README.md"
authors = [
    {name = "Pulkit Jai"},
]
license = {text = "MIT"}
keywords = ["artemis", "ai-safety", "red-teaming", "vulnerability", "chain-of-thought", "stark-tech"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=1.31.0",
    "groq>=0.31.0",
    "ipykernel>=6.30.1",
    "jupyter>=1.1.1",
    "nltk>=3.9.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "python-dotenv>=1.1.1",
]

[project.urls]
Homepage = "https://www.kaggle.com/competitions/openai-gpt-oss-20b-red-teaming/overview"

[project.scripts]
artemis = "artemis_redteam.cli:main"

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
artemis_redteam = ["*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py313']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
