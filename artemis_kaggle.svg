<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" style="background: linear-gradient(135deg, #1a1f3a 0%, #2d3561 100%);">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    
    <filter id="subtle-glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Simple crosshair target - minimal -->
  <g transform="translate(140,140)" opacity="0.4">
    <circle r="40" fill="none" stroke="#00d4ff" stroke-width="1"/>
    <path d="M-50,0 h20 M50,0 h-20 M0,-50 v20 M0,50 v-20" stroke="#00d4ff" stroke-width="1"/>
    <circle r="3" fill="#00ff88"/>
  </g>
  
  <!-- ARTEMIS - clean typography -->
  <text x="320" y="135" 
        font-family="'Helvetica Neue', 'Arial', sans-serif" 
        font-size="48" 
        font-weight="300" 
        text-anchor="middle" 
        fill="url(#textGrad)" 
        filter="url(#subtle-glow)">
    ARTEMIS
  </text>
  
  <!-- Subtitle - very clean -->
  <text x="320" y="165" 
        font-family="'Helvetica Neue', 'Arial', sans-serif" 
        font-size="14" 
        font-weight="300" 
        text-anchor="middle" 
        fill="#00d4ff" 
        opacity="0.8">
    AI Threat Evaluation System
  </text>
  
  <!-- Minimal accent line -->
  <rect x="220" y="180" width="200" height="1" fill="url(#textGrad)" opacity="0.6"/>
</svg>